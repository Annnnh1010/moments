# 构建基础配置
[build]
  base = "front"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 构建超时时间延长（默认10分钟，这里拉到15分钟避免打包超时）
[build.environment]
  NODE_VERSION = "18"
  NPM_CONFIG_CACHE = ".npm"

# 缓存依赖，大幅加快二次构建速度
[[cache]]
  path = "node_modules"
[[cache]]
  path = ".npm"
[[cache]]
  path = ".vite"

# SPA路由重定向，解决刷新404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源缓存策略，优化加载速度
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片/静态资源缓存
[[headers]]
  for = "*.png,*.jpg,*.jpeg,*.gif,*.svg,*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# 禁止缓存HTML页面
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# 分支部署规则：仅dev分支正式部署，PR生成预览站
[dev]
  command = "npm run dev"
[[plugins]]
  package = "@netlify/plugin-lighthouse"
